name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      # Trusted metadata-only action: never check out or execute PR code here.
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@41e4bc29aa877568a5a099a0c1b0639ea2bdc5e5
