name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      # Trusted metadata-only action: never check out or execute PR code here.
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@4f443f3a748fd9a35e9069108479c80e02cb1997
